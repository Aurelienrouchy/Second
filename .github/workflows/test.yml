name: CI

# Bloque les régressions sur chaque push et chaque PR.
# 3 jobs exécutables (unit / functions / rules) + 1 job e2e décrit mais
# non exécutable sans device (continue-on-error, voir TODO Maestro plus bas).
#
# Split Jest / Vitest (cf. jest.config.js + vitest.config.ts) :
#   - Jest  : composants / écrans / hooks RN -> npm run test:unit
#   - Vitest functions/ -> npm run test:functions
#   - Vitest tests/security/ (emulators) -> npm run test:security
on:
  push:
    branches: [main]
  pull_request:

# Annule les runs précédents encore en vol sur la meme ref (PR repush).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1 — unit : Jest (composants/écrans/hooks RN) + typecheck app + tests
  # ---------------------------------------------------------------------------
  unit:
    name: Unit (Jest) + tsc app + tsc tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root deps
        run: npm ci

      # functions a son propre package.json : on l'installe car le typecheck
      # app (tsc --noEmit) peut résoudre des types partagés, et c'est cohérent
      # avec le job functions qui le ré-installe de toute façon.
      - name: Install functions deps
        run: cd functions && npm ci

      - name: Jest unit tests
        run: npm run test:unit

      # Typecheck APP (scope prod) : le tsconfig principal exclut les fichiers
      # de test pour ne pas exposer les globals Jest au code de production.
      - name: Typecheck app
        run: npx tsc --noEmit

      # Typecheck TESTS (scope test) : tsconfig.test.json type-check tous les
      # fichiers de test (Jest + Vitest) avec les globals Jest (@types/jest).
      # On ne perd donc aucune vérification de type sur les tests.
      - name: Typecheck tests
        run: npm run typecheck:tests

  # ---------------------------------------------------------------------------
  # JOB 2 — functions : Vitest functions/ + typecheck functions
  # ---------------------------------------------------------------------------
  functions:
    name: Functions (Vitest) + tsc functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions deps
        run: cd functions && npm ci

      # test:functions fait déjà `cd functions && npx vitest run`.
      - name: Vitest functions tests
        run: npm run test:functions

      - name: Typecheck functions
        run: cd functions && npx tsc --noEmit

  # ---------------------------------------------------------------------------
  # JOB 3 — rules : tests sécurité Firestore/Storage via emulators (JVM = JDK 21)
  # ---------------------------------------------------------------------------
  rules:
    name: Security rules (emulators)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Les emulators Firestore/Storage tournent sur la JVM.
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install root deps
        run: npm ci

      # firebase-tools n'est pas une dépendance du projet : on l'installe
      # globalement pour que `firebase emulators:exec` (script test:security)
      # fonctionne sans modifier package.json.
      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # test:security = firebase emulators:exec --only firestore,storage,auth 'test:security:run'
      - name: Run security rules tests
        run: npm run test:security

  # ---------------------------------------------------------------------------
  # JOB 4 — e2e (Maestro) : DÉCRIT mais NON EXÉCUTABLE en CI standard.
  #
  # TODO(e2e): nécessite un build de l'app + un simulateur iOS / émulateur
  # Android (ou Maestro Cloud). Non exécutable sur un runner sans device.
  # Structure standard mobile-dev/maestro fournie ci-dessous. Décommenter
  # et brancher un job de build EAS (ou un dev build local) + le simulateur
  # avant d'activer. Garde `continue-on-error: true` tant que ce n'est pas
  # stabilisé pour ne pas bloquer la CI.
  #
  # Flows : .maestro/flows (cf. npm run test:e2e -> maestro test .maestro/flows)
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E (Maestro) [non-bloquant]
    runs-on: ubuntu-latest
    continue-on-error: true
    # TODO(e2e): retirer ce guard `if: false` une fois le build + device prêts.
    if: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # - name: Setup Node
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: 20
      #     cache: npm
      #
      # - name: Install deps
      #   run: npm ci
      #
      # TODO(e2e): produire un binaire installable.
      #   iOS : eas build --profile development --platform ios --local (ou Maestro Cloud)
      #   Android : eas build --profile development --platform android --local
      #   puis booter un simulateur/émulateur et installer le binaire.
      #
      # - name: Install Maestro CLI
      #   run: |
      #     curl -Ls "https://get.maestro.mobile.dev" | bash
      #     echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      #
      # - name: Run Maestro flows
      #   run: npm run test:e2e   # maestro test .maestro/flows
      #
      # Alternative recommandée : action officielle Maestro Cloud
      #   uses: mobile-dev-inc/action-maestro-cloud@v1
      #   with:
      #     api-key: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
      #     app-file: <chemin-vers-le-binaire>
