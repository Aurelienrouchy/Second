# 00 — Launch smoke test
#
# Cold-starts the app from a clean state and asserts the first user-facing
# surface renders. On a fresh install (cleared state) the router sends the
# user to the onboarding *welcome* screen (app/onboarding.tsx → showWelcome),
# which shows the "Seconde" brand title and a "CONTINUER" CTA before the
# size-collection form.
#
# This is the canonical "the app boots and paints something interactive"
# check. Selectors use the stable testIDs now posted on the onboarding
# surfaces: `onboarding-welcome` (welcome root), `onboarding-continue` (CTA),
# `onboarding-form` (size-collection form root) — see app/onboarding.tsx.
appId: com.seconde.app
---
# Fresh boot: clearState wipes AsyncStorage so ONBOARDING_COMPLETED_KEY is
# unset and the app deterministically lands on onboarding, regardless of any
# prior run on the device/simulator.
- launchApp:
    clearState: true

# Reanimated FadeInDown/FadeIn intros stagger up to ~400ms; wait (up to 15s)
# for the welcome root before asserting so the test is not animation-flaky.
- extendedWaitUntil:
    visible:
      id: "onboarding-welcome"
    timeout: 15000

# The welcome CTA — stable testID on the CONTINUER Button.
- assertVisible:
    id: "onboarding-continue"

# Confirm the cold-start path is interactive: advancing past the welcome screen
# reveals the onboarding size-collection form (proves navigation works, not
# just a static first paint).
- tapOn:
    id: "onboarding-continue"

# The form screen root — proves the welcome → form transition landed.
- extendedWaitUntil:
    visible:
      id: "onboarding-form"
    timeout: 10000
