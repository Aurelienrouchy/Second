# auth-signup-consent — inscription email + consentement Loi 25 (age gate 16+)
#
# Couvre le parcours utilisateur clé du domaine auth-onboarding :
#   boot propre → onboarding (skip « Passer ») → home → tab Profil (état invité)
#   → ouverture de la bottom sheet auth → bascule vers l'inscription → saisie
#   email/mot de passe/nom + date de naissance (>= 16 ans) + cases de
#   consentement (CGU + Politique) → soumission.
#
# Règle métier vérifiée : le bouton « S'INSCRIRE » reste désactivé tant que
# l'âge n'est pas >= 16 ET que les deux cases obligatoires ne sont pas cochées
# (Loi 25 art. 12, 14). Le flow remplit tout, coche les deux cases, puis soumet ;
# la disparition du formulaire d'inscription prouve que la soumission a été
# acceptée (gate franchi) et non bloquée.
#
# Sélecteurs : testIDs stables désormais posés sur la bottom sheet auth —
#   - onboarding-skip / onboarding-skip-form (Passer)
#   - profile-guest-connect (CTA SE CONNECTER de l'état invité)
#   - auth-tab-signup (bascule vers l'inscription)
#   - signup-username-input / signup-email-input / signup-password-input
#   - signup-dob-day / signup-dob-month / signup-dob-year
#   - signup-consent-terms / signup-consent-privacy (Checkbox)
#   - signup-submit (bouton S'inscrire)
# Les titres de la sheet (« te revoir » / « Bienvenue sur ») n'ont pas de testID
# de racine → matchés par copy FR (listés en `deferred` du rapport).
#
# NB : l'inscription réelle frappe Firebase Auth + le callable recordSignupConsent.
# En CI sans backend émulé, la soumission échouera côté réseau APRÈS le gate
# client — ce flow valide le parcours + le gate de consentement jusqu'au tap de
# soumission, pas la création serveur (couverte par les tests unitaires
# authService/authStore).
appId: com.seconde.app
---
# Boot propre : le sous-flow partagé clearState garantit l'atterrissage
# déterministe sur l'onboarding et gère le launcher / dev-menu du dev-client.
- runFlow: ../subflows/open-app-fresh.yaml

# Onboarding welcome : on saute la collecte de préférences via « Passer »
# (handleSkip → router.replace('/(tabs)')), chemin invité direct.
- extendedWaitUntil:
    visible:
      id: "onboarding-welcome"
    timeout: 15000
- tapOn:
    id: "onboarding-skip"

# Si l'écran de formulaire onboarding s'affiche encore, re-tap « Passer ».
- tapOn:
    id: "onboarding-skip-form"
    optional: true

# Home atteinte : la tab bar expose « Profil » (tabBarAccessibilityLabel → id).
- extendedWaitUntil:
    visible:
      id: "Profil"
    timeout: 15000
- tapOn:
    id: "Profil"

# État invité du Profil → CTA « SE CONNECTER » qui ouvre la bottom sheet auth.
- extendedWaitUntil:
    visible:
      id: "profile-guest-connect"
    timeout: 10000
- tapOn:
    id: "profile-guest-connect"

# La bottom sheet s'ouvre sur l'onglet connexion (« Content de / te revoir »).
# Le titre de la sheet n'a pas de testID de racine → copy de secours (deferred).
- extendedWaitUntil:
    visible:
      text: "te revoir"
    timeout: 10000

# Basculer vers l'inscription via l'onglet « S'inscrire ».
- tapOn:
    id: "auth-tab-signup"

# Formulaire d'inscription affiché (« Bienvenue sur » — pas de testID, deferred).
- extendedWaitUntil:
    visible:
      text: "Bienvenue sur"
    timeout: 10000

# Nom d'affichage.
- tapOn:
    id: "signup-username-input"
- inputText: "Marie Test"
- hideKeyboard

# Email.
- tapOn:
    id: "signup-email-input"
- inputText: "marie.test+maestro@example.com"
- hideKeyboard

# Mot de passe.
- tapOn:
    id: "signup-password-input"
- inputText: "secret123"
- hideKeyboard

# Date de naissance — âge >= 16 garanti par une année largement adulte.
- tapOn:
    id: "signup-dob-day"
- inputText: "15"
- tapOn:
    id: "signup-dob-month"
- inputText: "06"
- tapOn:
    id: "signup-dob-year"
- inputText: "1995"
- hideKeyboard

# Cases de consentement obligatoires (CGU + Politique). Les Checkbox portent un
# testID stable transmis au primitif tappable.
- tapOn:
    id: "signup-consent-terms"
- tapOn:
    id: "signup-consent-privacy"

# Soumettre : le bouton « S'inscrire » n'est actif QUE si âge >= 16 ET les deux
# cases cochées. Le tap réussit ⇒ gate de consentement franchi.
- tapOn:
    id: "signup-submit"

# Preuve de franchissement du gate : le formulaire d'inscription quitte l'écran
# (soit succès et fermeture de la sheet, soit une alerte réseau en CI sans
# backend). On attend la disparition du titre d'inscription.
- extendedWaitUntil:
    notVisible:
      text: "Bienvenue sur"
    timeout: 20000
