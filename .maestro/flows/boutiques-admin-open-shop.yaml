# boutiques-admin-open-shop — parcours admin : ouvrir une boutique
#
# Domaine boutiques-admin. Couvre le parcours clé de modération côté admin :
#   Profil → Paramètres → entrée "Administration" → Panel Admin (gestion des
#   boutiques) → onglet "En attente" → ouvrir une boutique listée (carte de
#   validation) → arriver sur le détail de la boutique.
#
# Pourquoi ce parcours :
#   - C'est le point d'entrée unique de la modération (settings → /admin/shops),
#     gardé par AdminLayout (custom claim admin) + checkAdminAccess. Le flow
#     prouve que la garde laisse passer un admin et que la liste s'affiche.
#   - "Ouvrir une boutique" depuis la liste route vers /admin/shop-detail/[id]
#     (handleViewDetails) : le parcours métier de revue d'une demande.
#
# Pré-requis device/simulateur :
#   - Un compte ADMIN connecté (custom claim `admin` ou users/{uid}.isAdmin).
#     Sans ce rôle, l'entrée "Administration" des réglages est masquée et
#     AdminLayout redirige vers /(tabs) — le flow échouerait volontairement.
#   - Au moins une boutique "en attente" seedée (sinon l'onglet est vide ;
#     le flow bascule alors sur "Toutes" pour trouver une carte à ouvrir).
#
# Sélecteurs : testIDs stables — menu-item-settings (ProfileMenu),
#   admin-shops-screen, shop-validation-card-<id> (matché par regex),
#   admin-shop-detail-screen. L'entrée "Administration" (SettingItem) et les
#   onglets de filtre (En attente / Toutes) n'ont pas encore de testID → copy FR
#   (listés en 'deferred' du rapport).
appId: com.seconde.app
---
# Session admin supposée connectée : on ne wipe pas l'état (sous-flow partagé,
# gère un éventuel launcher/dev-menu résiduel du dev-client).
- runFlow: ../subflows/open-app.yaml

# Franchir un CTA d'onboarding résiduel sans casser si déjà sur la home.
- runFlow:
    when:
      visible:
        id: "onboarding-continue"
    commands:
      - tapOn:
          id: "onboarding-continue"
          optional: true

# Aller dans l'onglet Profil (tabBarAccessibilityLabel → id).
- extendedWaitUntil:
    visible:
      id: "Profil"
    timeout: 20000
- tapOn:
    id: "Profil"

# Ouvrir l'écran Paramètres depuis le menu du profil (testID stable). Le menu du
# profil défile : "Paramètres" est sous la ligne de flottaison → on défile pour
# le révéler avant de taper.
- scrollUntilVisible:
    element:
      id: "menu-item-settings"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "menu-item-settings"

# Section Administration (visible uniquement pour un admin) → ouvrir le panel.
# (Le SettingItem "Administration" n'a pas de testID → copy FR, cf. deferred.)
- extendedWaitUntil:
    visible:
      text: "Administration"
    timeout: 15000
- tapOn:
    text: "Administration"

# Panel Admin — gestion des boutiques. testID stable sur l'écran racine.
- extendedWaitUntil:
    visible:
      id: "admin-shops-screen"
    timeout: 15000
- assertVisible:
    text: "Gestion des boutiques"

# Onglet "En attente" : le bucket de modération par défaut.
# (Les onglets de filtre n'ont pas de testID → copy FR, cf. deferred.)
- tapOn:
    text: "En attente"
    optional: true

# S'il n'y a aucune boutique en attente, basculer sur "Toutes" pour garantir
# qu'au moins une carte est ouvrable (parcours déterministe quel que soit le seed).
- runFlow:
    when:
      visible:
        text: "Aucune boutique"
    commands:
      - tapOn:
          text: "Toutes"

# Ouvrir la première boutique listée. La carte porte un testID paramétré par id
# (shop-validation-card-<id>) → matché par regex sur le préfixe (1re carte).
- extendedWaitUntil:
    visible:
      id: "shop-validation-card-.*"
    timeout: 15000
- tapOn:
    id: "shop-validation-card-.*"
    index: 0

# Détail de la boutique : l'écran admin de revue (testID racine stable) prouve
# la navigation liste → détail.
- extendedWaitUntil:
    visible:
      id: "admin-shop-detail-screen"
    timeout: 15000
