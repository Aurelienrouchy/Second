# notifications — Ouvrir le centre de notifications
#
# Parcours clé du domaine notifications : depuis l'accueil, l'utilisateur tape la
# cloche (HomeHeader) et atterrit sur le centre de notifications (app/notifications.tsx).
# Le centre affiche soit la liste, soit l'état vide ("Aucune notification") — les
# deux sont des résultats VALIDES (un nouvel utilisateur n'a pas de notifs). Le flow
# valide que la navigation cloche → centre fonctionne et que l'écran peint.
#
# Sélecteurs : testID stables posés au domaine
#   - Accueil (tabBarAccessibilityLabel → id)
#   - home-notifications-bell  (features/home/header/HomeHeader.tsx)
#   - notifications-screen     (app/notifications.tsx, container racine)
#   - notifications-empty      (app/notifications.tsx, état vide)
# L'état vide affiche "Aucune notification" (pas de testID sur le texte) → copy
# de secours.
#
# Pré-requis : un utilisateur déjà onboardé/connecté qui atterrit sur l'onglet
# Accueil (la cloche n'existe que dans le HomeHeader). On NE clear PAS l'état pour
# ne pas retomber sur l'onboarding (cf. 00-launch.yaml).
appId: com.seconde.app
---
# Conserve la session (sous-flow partagé, gère launcher/dev-menu résiduel).
- runFlow: ../subflows/open-app.yaml

# Isolation : une session conservée peut reprendre sur un écran de pile (ex.
# /search laissé par un run précédent) où la tab bar est masquée. Si l'onglet
# Accueil n'est pas visible, on revient en arrière pour retrouver les tabs.
- runFlow:
    when:
      notVisible:
        id: "Accueil"
    commands:
      - back

# On part de l'onglet Accueil. tabBarButtonTestID "Accueil" est exposé par
# (tabs)/_layout.tsx — sélecteur stable (id) pour revenir sur le Home si besoin.
- runFlow:
    when:
      visible:
        id: "Accueil"
    commands:
      - tapOn:
          id: "Accueil"

# La cloche du HomeHeader (jusqu'à 15s : les intros Home utilisent FadeIn*).
- extendedWaitUntil:
    visible:
      id: "home-notifications-bell"
    timeout: 15000

- tapOn:
    id: "home-notifications-bell"

# Le centre de notifications a peint (container racine).
- extendedWaitUntil:
    visible:
      id: "notifications-screen"
    timeout: 10000

# Le centre est interactif : il montre soit l'état vide, soit au moins un item.
# Les deux sont des issues valides → on accepte l'un OU l'autre sans échouer.
- runFlow:
    when:
      visible:
        id: "notifications-empty"
    commands:
      - assertVisible:
          text: "Aucune notification"
