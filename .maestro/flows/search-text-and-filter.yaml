# search-text-and-filter — recherche texte + application d'un filtre
#
# Domaine : recherche-decouverte. Couvre le parcours utilisateur clé :
#   home → ouvrir l'écran de recherche → saisir un terme → valider (OK / commit
#   immédiat qui bypasse le debounce) → voir la grille de résultats → ouvrir un
#   filtre (État) via son chip → sélectionner une valeur → la grille se met à
#   jour (les filtres restent appliqués au terme).
#
# Sélecteurs : testID stables posés au domaine search
#   - home-search-bar               (HomeHeader → ouvre /search)
#   - search-input                  (SearchHeader TextInput)
#   - search-submit-button          (bouton OK, commit immédiat)
#   - search-results-grid           (ProductGrid des résultats)
#   - filter-chip-condition         (chip "État" de FilterChipsRow)
#   - selection-item-bon état       (item "Bon état" du bottom sheet État ;
#                                     value = 'bon état' issue de data/conditions)
#   - filter-chip-remove-condition  (X de retrait du chip État)
# Tous les sélecteurs de ce flow sont désormais des testID stables.
appId: com.seconde.app
---
# Boot propre. Permissions accordées d'office (la recherche visuelle peut
# demander la caméra, mais ce flow reste sur la recherche texte).
- launchApp:
    clearState: true
    permissions:
      camera: allow
      photos: allow

# Franchir l'onboarding jusqu'à la home (barre de recherche visible).
- extendedWaitUntil:
    visible:
      id: "onboarding-welcome"
    timeout: 15000
- tapOn:
    id: "onboarding-continue"
    optional: true
- runFlow:
    when:
      visible:
        id: "onboarding-continue"
    commands:
      - tapOn:
          id: "onboarding-continue"
          optional: true

# ── Ouvrir l'écran de recherche depuis la barre de la home ──
- extendedWaitUntil:
    visible:
      id: "home-search-bar"
    timeout: 15000
- tapOn:
    id: "home-search-bar"

# ── Saisir un terme et le valider (commit immédiat via OK) ──
- extendedWaitUntil:
    visible:
      id: "search-input"
    timeout: 10000
- tapOn:
    id: "search-input"
- inputText: "robe"
# Le bouton OK n'apparaît qu'avec du texte saisi → commit immédiat (bypass du
# debounce de 350 ms côté useArticleSearch).
- tapOn:
    id: "search-submit-button"
- hideKeyboard

# ── La grille de résultats doit apparaître (succès de la recherche texte) ──
- extendedWaitUntil:
    visible:
      id: "search-results-grid"
    timeout: 20000

# ── Appliquer un filtre État via son chip ──
- tapOn:
    id: "filter-chip-condition"
# Le bottom sheet "État" liste les conditions ; chaque item porte un testID
# `selection-item-<value>` (value 'bon état' issue de data/conditions).
- extendedWaitUntil:
    visible:
      id: "selection-item-bon état"
    timeout: 10000
- tapOn:
    id: "selection-item-bon état"

# ── Le chip État devient actif (un X de retrait apparaît) et la grille reste
#    affichée : le filtre est appliqué au terme sans casser les résultats. ──
- extendedWaitUntil:
    visible:
      id: "filter-chip-remove-condition"
    timeout: 10000
- assertVisible:
    id: "search-results-grid"

# ── Retirer le filtre via le X du chip ne doit PAS rouvrir le sheet ──
- tapOn:
    id: "filter-chip-remove-condition"
# Le chip n'est plus actif : son X disparaît, la grille reste là.
- extendedWaitUntil:
    notVisible:
      id: "filter-chip-remove-condition"
    timeout: 10000
- assertVisible:
    id: "search-results-grid"
