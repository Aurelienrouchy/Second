# sell-create-with-photos — création d'un article avec photos + analyse IA
#
# Couvre le flux complet rapporté en régression par le fondateur :
#   onglet Vendre → caméra/capture → ajout de photos → upload Storage +
#   analyse IA (callable analyzeProductImage) → champs pré-remplis dans
#   l'écran Détails → publication.
#
# Régression corrigée en amont : l'upload Storage passait par
# fetch(uri).blob() + uploadBytes, KO sous React Native New Arch (RN 0.83) →
# l'upload échouait puis l'analyse IA ne recevait jamais les images. Le service
# upload désormais le base64 via uploadString(..., 'base64'). Ce flow vérifie
# que l'utilisateur arrive bien jusqu'à des champs pré-remplis et peut publier.
#
# Pré-requis device/simulateur :
#   - Au moins 1 photo dans la galerie (les CI Maestro/EAS fournissent des
#     images de démo ; sinon en ajouter via les seeds du simulateur).
#   - Les permissions caméra + photos sont accordées via launchApp.permissions.
#
# Sélecteurs : testID stables posés au tunnel sell. Restent en copy FR (pas de
# testID) : la sélection native de la galerie système (Add / Ajouter) et la
# modale de succès post-publication ("Annonce publiée") — listés en 'deferred'.
appId: com.seconde.app
---
# Boot propre via le sous-flow partagé (clearState + gestion launcher/dev-menu).
# Les permissions caméra/photos sont accordées au simulateur avant le run pour
# ne pas bloquer sur les dialogues natifs pendant le flow.
- runFlow: ../subflows/open-app-fresh.yaml

# Passer l'onboarding (welcome → form) jusqu'à atteindre la home avec la tab bar.
- extendedWaitUntil:
    visible:
      id: "onboarding-welcome"
    timeout: 15000
- tapOn:
    id: "onboarding-continue"

# L'onboarding peut demander des infos (taille, etc.) ; on tente de le franchir
# si un CTA "CONTINUER" est présent, sans casser si déjà sur la home.
- runFlow:
    when:
      visible:
        id: "onboarding-continue"
    commands:
      - tapOn:
          id: "onboarding-continue"
          optional: true

# Ouvrir le flux de vente via la tab "Vendre" (CTA central surélevé).
- extendedWaitUntil:
    visible:
      id: "Vendre"
    timeout: 15000
- tapOn:
    id: "Vendre"

# Écran caméra/capture : l'utilisateur ajoute des photos depuis la galerie
# plutôt que la caméra (déterministe en CI). On ouvre le sélecteur de photos.
- extendedWaitUntil:
    visible:
      id: "sell-capture-screen"
    timeout: 15000
- tapOn:
    id: "sell-gallery-button"
    optional: true

# Sélection native de photos : prendre les premières vignettes disponibles.
# (Maestro pilote la galerie système, hors testID app ; libellés selon la locale
#  du simulateur — copy en 'deferred'.)
- tapOn:
    point: "20%,30%"
- tapOn:
    text: "Add"
    optional: true
- tapOn:
    text: "Ajouter"
    optional: true

# Continuer vers l'écran photos-review (qui déclenche l'upload + l'analyse).
- tapOn:
    id: "sell-capture-continue"

# Écran "Tes photos" : l'analyse IA démarre automatiquement (container racine).
- extendedWaitUntil:
    visible:
      id: "sell-photos-review-screen"
    timeout: 15000

# L'analyse aboutit → le bouton CONTINUER (état complete) apparaît. C'est la
# preuve que l'upload Storage a réussi ET que la callable a renvoyé un résultat
# (sinon on resterait en loading ou on verrait l'écran d'erreur).
- extendedWaitUntil:
    visible:
      id: "sell-photos-review-continue"
    timeout: 60000
- tapOn:
    id: "sell-photos-review-continue"

# Écran Détails : les champs doivent être pré-remplis par l'analyse IA.
- extendedWaitUntil:
    visible:
      id: "sell-details-screen"
    timeout: 15000
- assertVisible:
    id: "sell-title-input"
- assertVisible:
    id: "sell-description-input"
# Le sélecteur de catégorie prouve que le mapping IA → formulaire a fonctionné.
- assertVisible:
    id: "sell-category-selector"

# Poursuivre vers l'écran prix (footer Détails).
- tapOn:
    id: "sell-details-footer-cta"

# Écran "Prix & livraison" : renseigner un montant via le champ prix (testID stable).
- extendedWaitUntil:
    visible:
      id: "sell-pricing-screen"
    timeout: 15000
- tapOn:
    id: "sell-price-input"
- inputText: "25"
- hideKeyboard
# Avancer vers l'aperçu (footer prix = APERÇU).
- tapOn:
    id: "sell-pricing-footer-cta"

# Aperçu → publication. Le CTA final publie l'annonce.
- extendedWaitUntil:
    visible:
      id: "sell-preview-screen"
    timeout: 15000
- tapOn:
    id: "sell-publish-button"

# Succès : la modale de confirmation s'affiche ("Annonce publiée"). La modale
# n'a pas encore de testID → copy FR de secours (deferred).
- extendedWaitUntil:
    visible:
      text: "Annonce publiée"
    timeout: 20000
