# swap-propose-exchange — proposer un échange depuis la Swap Zone
#
# Couvre le parcours clé du domaine swap :
#   home → Swap Zone (zone généraliste permanente) → sélection d'un article du
#   stock → écran "Proposer un échange" → ajout d'un de mes articles →
#   comparaison de valeur (+ complément optionnel) → envoi de la proposition →
#   confirmation + atterrissage sur "Mes échanges".
#
# Sélecteurs : testID stables là où ils existent
#   - onboarding-continue   (sortie d'onboarding)
#   - home-swap-zone-entry  (carte d'accès Swap Zone, HomeHeader/SwapZoneSection)
#   - swap-zone-screen      (app/swap-zone.tsx, container racine de la zone)
#   - propose-swap-add-mine (CTA "ajouter mon article", ArticleSelectionSection)
#   - propose-swap-submit   (envoi de la proposition, SubmitFooter)
#
# testID MANQUANTS (copy FR / coordonnées en attendant — listés en deferred) :
#   - PartyItemCard (carte article de la grille Swap Zone) → tap par coordonnées
#   - bouton "Proposer" de la MultiSelectBar (sélection multiple)
#   - SwapItemSelector : items + bouton "Confirmer" → tap par coordonnées
#   - propose-swap screen root + labels "Leur article" / "Mon article proposé"
#   - Alert FR "Proposition envoyée !" + écran "Mes échanges" (RN Alert / titre)
#
# Pré-requis : un utilisateur authentifié (la proposition d'échange exige
# l'auth — requireAuth) et au moins un article actif dans son inventaire +
# du stock dans la zone. En CI on franchit l'onboarding puis on tente le
# parcours de façon défensive (taps optional) pour rester non-flaky.
appId: com.seconde.app
---
# Boot propre via le sous-flow partagé (clearState + gestion launcher/dev-menu).
- runFlow: ../subflows/open-app-fresh.yaml

# Franchir l'onboarding welcome → form jusqu'à la home.
- extendedWaitUntil:
    visible:
      id: "onboarding-welcome"
    timeout: 15000
- tapOn:
    id: "onboarding-continue"
    optional: true
- runFlow:
    when:
      visible:
        id: "onboarding-continue"
    commands:
      - tapOn:
          id: "onboarding-continue"
          optional: true

# Accès à la Swap Zone depuis la home via la carte d'entrée dédiée (testID stable).
- extendedWaitUntil:
    visible:
      id: "home-swap-zone-entry"
    timeout: 15000
- tapOn:
    id: "home-swap-zone-entry"

# Stock de la zone : container racine peint (testID stable). On ouvre ensuite un
# article de la grille. Un simple tap sur une carte article lance la proposition
# (handleProposeSwap → requireAuth). Faute de testID sur PartyItemCard, on tape
# la première vignette par coordonnées (deferred).
- extendedWaitUntil:
    visible:
      id: "swap-zone-screen"
    timeout: 15000
- tapOn:
    point: "25%,45%"

# Si l'app demande de s'authentifier avant de proposer (requireAuth), on
# poursuit le sheet d'auth de façon optionnelle (le compte de test est déjà
# connecté en CI ; ce bloc protège seulement contre un état déconnecté).
- tapOn:
    text: "Continuer"
    optional: true

# Écran "Proposer un échange" : l'article ciblé pré-remplit "Leur article".
# (Pas de testID racine ni de label → copy FR de secours, deferred.)
- extendedWaitUntil:
    visible:
      text: "Mon article proposé"
    timeout: 15000
- assertVisible:
    text: "Leur article"

# Ajouter un de mes articles via le sélecteur (testID stable sur le CTA).
- tapOn:
    id: "propose-swap-add-mine"
# Sélecteur "Sélectionner mes articles" (pas de testID sur les items ni sur
# "Confirmer" → coordonnées + copy FR, deferred).
- extendedWaitUntil:
    visible:
      text: "Sélectionner mes articles"
    timeout: 10000
- tapOn:
    point: "50%,40%"
- tapOn:
    text: "Confirmer"
    optional: true

# Envoyer la proposition (testID stable sur le footer).
- tapOn:
    id: "propose-swap-submit"

# Confirmation FR de l'envoi (Alert "Proposition envoyée !" — RN Alert, pas de
# testID, deferred).
- extendedWaitUntil:
    visible:
      text: "Proposition envoyée !"
    timeout: 15000
- tapOn:
    text: "OK"

# Atterrissage sur "Mes échanges" (router.push('/my-swaps')) — pas de testID
# sur le titre, copy de secours (deferred).
- extendedWaitUntil:
    visible:
      text: "Mes échanges"
    timeout: 15000
    optional: true
